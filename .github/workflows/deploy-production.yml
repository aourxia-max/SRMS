name: SRMS 生产部署

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: srms-production
  cancel-in-progress: false

jobs:
  verify:
    name: 测试与构建
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: 安装根目录依赖
        run: npm ci

      - name: 部署脚本回归测试
        run: node --test deploy/tests/remote-deploy-stdin.test.mjs

      - name: 安装后端依赖
        run: npm ci --prefix backend

      - name: 生成 Prisma Client
        run: npm --prefix backend run prisma:generate

      - name: 安装前端依赖
        run: npm ci --prefix frontend

      - name: 安装中文字体
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fonts-droid-fallback
          font_path="$(find /usr/share/fonts -type f -name 'DroidSansFallbackFull.ttf' -print -quit)"
          test -f "$font_path"
          printf 'PDF_FONT_PATH=%s\n' "$font_path" >> "$GITHUB_ENV"

      - name: 后端单元测试
        run: npm --prefix backend test -- --runInBand

      - name: 后端 Lint
        run: npm --prefix backend run lint:check

      - name: Prisma 结构校验
        run: npm --prefix backend run prisma:validate

      - name: 前端单元测试
        run: npm --prefix frontend run test:unit -- --run --testTimeout=15000

      - name: 前后端构建
        run: npm run build

  deploy:
    name: 部署到生产服务器
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: 拉取已验证版本
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 制作精确版本部署包
        shell: bash
        run: |
          set -euo pipefail
          bundle_path="$RUNNER_TEMP/srms-${GITHUB_SHA}.bundle"
          remote_bundle="/tmp/srms-${GITHUB_SHA}.bundle"
          remote_script="/tmp/srms-remote-deploy-${GITHUB_SHA}.sh"
          git update-ref refs/heads/deploy-bundle "$GITHUB_SHA"
          trap 'git update-ref -d refs/heads/deploy-bundle' EXIT
          git bundle create "$bundle_path" refs/heads/deploy-bundle
          test -s "$bundle_path"
          git bundle verify "$bundle_path"
          printf 'DEPLOY_BUNDLE=%s\n' "$bundle_path" >> "$GITHUB_ENV"
          printf 'REMOTE_BUNDLE=%s\n' "$remote_bundle" >> "$GITHUB_ENV"
          printf 'REMOTE_SCRIPT=%s\n' "$remote_script" >> "$GITHUB_ENV"

      - name: 配置 SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.SRMS_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.SRMS_DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.SRMS_DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.SRMS_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/srms_deploy"
          chmod 600 "$HOME/.ssh/srms_deploy"
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"

      - name: 上传部署包
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.SRMS_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.SRMS_DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.SRMS_DEPLOY_USER }}
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/srms_deploy" -P "$DEPLOY_PORT" \
            "$DEPLOY_BUNDLE" "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_BUNDLE"

      - name: 备份数据库并更新 Docker 服务
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.SRMS_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.SRMS_DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.SRMS_DEPLOY_USER }}
          DEPLOY_DIR: ${{ secrets.SRMS_DEPLOY_DIR || '/opt/srms' }}
        run: |
          set -euo pipefail
          printf -v remote_args '%q ' "$DEPLOY_DIR" "$GITHUB_SHA" "$REMOTE_BUNDLE" "$REMOTE_SCRIPT"
          ssh -i "$HOME/.ssh/srms_deploy" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- $remote_args" <<'REMOTE'
          set -euo pipefail
          DEPLOY_DIR="$1"
          EXPECTED_SHA="$2"
          REMOTE_BUNDLE="$3"
          REMOTE_SCRIPT="$4"
          cd "$DEPLOY_DIR"
          test -s "$REMOTE_BUNDLE"
          git bundle verify "$REMOTE_BUNDLE" >&2
          git fetch "$REMOTE_BUNDLE" refs/heads/deploy-bundle >&2
          fetched_sha="$(git rev-parse FETCH_HEAD)"
          if [ "$fetched_sha" != "$EXPECTED_SHA" ]; then
            echo '部署包版本与本次已验证版本不一致，停止部署。' >&2
            exit 1
          fi
          git show "$fetched_sha:deploy/remote-deploy.sh" > "$REMOTE_SCRIPT"
          chmod 700 "$REMOTE_SCRIPT"
          exec "$REMOTE_SCRIPT" "$DEPLOY_DIR" "$EXPECTED_SHA" "$REMOTE_BUNDLE"
          REMOTE

      - name: 验证正式网站
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors \
            https://www.hetfw.cn/ >/dev/null
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors \
            https://www.hetfw.cn/api/health >/dev/null

      - name: 清理服务器临时部署包
        if: always()
        continue-on-error: true
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.SRMS_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.SRMS_DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.SRMS_DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -f "$HOME/.ssh/srms_deploy"
          printf -v remote_bundle_q '%q' "$REMOTE_BUNDLE"
          printf -v remote_script_q '%q' "$REMOTE_SCRIPT"
          ssh -i "$HOME/.ssh/srms_deploy" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "rm -f -- $remote_bundle_q $remote_script_q"
