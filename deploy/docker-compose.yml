services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-srms}
      MYSQL_USER: ${MYSQL_USER:-srms}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_root_password}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - srms_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-change_root_password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://${MYSQL_USER:-srms}:${MYSQL_PASSWORD:-change_me}@mysql:3306/${MYSQL_DATABASE:-srms}
      CORS_ORIGIN: http://localhost:${WEB_PORT:-5173}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      INITIAL_SUPER_ADMIN_USERNAME: ${INITIAL_SUPER_ADMIN_USERNAME}
      INITIAL_SUPER_ADMIN_DISPLAY_NAME: ${INITIAL_SUPER_ADMIN_DISPLAY_NAME}
      INITIAL_SUPER_ADMIN_PASSWORD: ${INITIAL_SUPER_ADMIN_PASSWORD}
      TENANT_ID_ENCRYPTION_KEY: ${TENANT_ID_ENCRYPTION_KEY}
      TENANT_ID_HMAC_SECRET: ${TENANT_ID_HMAC_SECRET}
      TENANT_FILE_MAX_SIZE_BYTES: ${TENANT_FILE_MAX_SIZE_BYTES:-10485760}
      TENANT_FILE_ALLOWED_MIME_TYPES: ${TENANT_FILE_ALLOWED_MIME_TYPES:-application/pdf,image/png,image/jpeg,image/heic}
      BACKUP_DIR: /backups
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - srms_uploads:/uploads
      - srms_backups:/backups
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ../frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  srms_mysql_data:
  srms_uploads:
  srms_backups:
